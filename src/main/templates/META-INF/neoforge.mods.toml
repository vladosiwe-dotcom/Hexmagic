modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Iron's Spells 'n Spellbooks is an optional companion: when it is installed the Hex Staff
# behaves as one of its staves (attribute bonuses, spell projectile reflection).
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
